[global]
  # A stingy server: few credits, small I/O sizes, multichannel advertised.
  server multi channel support = yes
  smb2 max credits = 16
  smb2 max read = 65536
  smb2 max write = 65536
  smb2 max trans = 65536
# The Dockerfile appends 300 shares below: edge001..edge300, every tenth one hidden ($).
