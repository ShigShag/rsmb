# Shared by samba, samba-edge and samba-private. The role file included at the end (selected by
# the ROLE environment variable in entrypoint.sh) adds what differs between them.
[global]
  workgroup = TESTDOM
  netbios name = RSMB
  server role = standalone server
  server min protocol = SMB2_02
  disable netbios = yes
  smb ports = 445
  map to guest = Bad User
  guest account = nobody
  restrict anonymous = 0
  load printers = no
  printcap name = /dev/null
  disable spoolss = yes
  log level = 1

[share]
  path = /srv/share
  read only = no

[readonly]
  path = /srv/share
  read only = yes

[guest]
  path = /srv/guest
  guest ok = yes
  read only = yes

[encrypted]
  path = /srv/share
  read only = no
  smb encrypt = required

[tiny]
  path = /srv/tiny
  read only = no

include = /etc/samba/role.conf
