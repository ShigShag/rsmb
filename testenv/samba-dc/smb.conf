# The Kerberos server of the test environment: a Samba AD DC with its own KDC, realm RSMB.TEST.
[global]
  netbios name = DC
  realm = RSMB.TEST
  workgroup = RSMB
  server role = active directory domain controller
  dns forwarder = 127.0.0.1
  # NT ACLs in a file: the image is built and run without the privilege to set security.* xattrs.
  vfs objects = dfs_samba4 acl_xattr xattr_tdb
  disable netbios = yes
  smb ports = 445
  load printers = no
  printcap name = /dev/null
  disable spoolss = yes
  server multi channel support = no
  # kerberos:3 prints one line per KDC request with the client's address (the tests read it).
  log level = 1 kerberos:3

[sysvol]
  path = /var/lib/samba/sysvol
  read only = no

[netlogon]
  path = /var/lib/samba/sysvol/rsmb.test/scripts
  read only = no

[share]
  path = /srv/share
  read only = no

[encrypted]
  path = /srv/share
  read only = no
  smb encrypt = required
